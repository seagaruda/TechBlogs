name: Deploy to Cloudflare Pages

# Direct Upload: the same production build runs here and is pushed to a
# Cloudflare Pages project, so the site does not depend on Cloudflare's own
# build image having Hugo Extended + Go for Hugo Modules.
#
# Required (one-time):
#   Settings → Secrets and variables → Actions
#     secrets:  CLOUDFLARE_API_TOKEN   (Account → Cloudflare Pages → Edit)
#               CLOUDFLARE_ACCOUNT_ID
#     variables: CLOUDFLARE_PAGES_ENABLED = true   (gates pushes)
#   optional variables: CLOUDFLARE_PROJECT_NAME (default: techblogs)
#                       CLOUDFLARE_SITE_URL     (default: https://<project>.pages.dev/)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: 1.27.3
  HUGO_VERSION: "0.168.0"
  GOWORK: off
  HUGO_MODULE_WORKSPACE: off
  HUGO_CACHEDIR: ${{ github.workspace }}/.hugo_cache

jobs:
  deploy:
    name: Build and deploy
    if: github.event_name == 'workflow_dispatch' || vars.CLOUDFLARE_PAGES_ENABLED == 'true'
    environment:
      name: cloudflare-pages
      url: ${{ steps.deploy.outputs.deployment-url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: go.sum

      - name: Install Hugo Extended
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Record build tool versions
        run: |
          go version
          hugo version

      - name: Resolve deployment settings
        env:
          CONFIGURED_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
          CONFIGURED_SITE_URL: ${{ vars.CLOUDFLARE_SITE_URL }}
        run: |
          # Cloudflare project names are lowercase; the repository is TechBlogs.
          CF_PROJECT_NAME="${CONFIGURED_PROJECT_NAME:-seagaruda-blog}"
          CF_SITE_URL="${CONFIGURED_SITE_URL:-https://blog.seagaruda.com/}"
          echo "CF_PROJECT_NAME=${CF_PROJECT_NAME}" >> "${GITHUB_ENV}"
          echo "CF_SITE_URL=${CF_SITE_URL}" >> "${GITHUB_ENV}"

      - name: Download OINK
        run: go mod download github.com/pgsty/oink

      - name: Build
        run: |
          hugo --cleanDestinationDir --gc --minify --environment production \
            --printPathWarnings \
            --baseURL "${CF_SITE_URL}"

      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=${{ env.CF_PROJECT_NAME }} --branch=${{ github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
