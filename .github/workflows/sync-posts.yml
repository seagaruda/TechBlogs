name: Sync posts to blog-index

on:
  push:
    branches: [main]
    paths:
      - "content/blog/post/**.md"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TechBlogs
        uses: actions/checkout@v4
        with:
          path: techblogs

      - name: Generate posts.json
        run: |
          python3 - <<'PYEOF'
          import json, os, re
          from datetime import datetime, timezone

          SITE = "https://blog.seagaruda.com"
          REPO = "seagaruda/TechBlogs"
          BRANCH = "main"
          SRC = "techblogs/content/blog/post"

          def parse(path):
              """Return (front matter dict, body) for a Hugo Markdown file."""
              raw = open(path, encoding="utf-8").read()
              m = re.match(r"^---\s*\n(.*?)\n---\s*\n", raw, re.DOTALL)
              if not m:
                  return {}, raw
              fm, body = {}, raw[m.end():]
              for line in m.group(1).splitlines():
                  kv = re.match(r"^(\w+):\s*(.*)$", line)
                  if not kv:
                      continue
                  key, val = kv.group(1), kv.group(2).strip()
                  arr = re.match(r"^\[(.*)\]$", val)
                  if arr:
                      fm[key] = [t.strip().strip('"').strip("'")
                                 for t in arr.group(1).split(",") if t.strip()]
                  else:
                      fm[key] = val.strip('"').strip("'")
              return fm, body

          def first_paragraph(body):
              for block in re.split(r"\n{2,}", body):
                  block = block.strip()
                  if not block or block[0] in "#>-|`" or block.startswith("!["):
                      continue
                  text = re.sub(r"[*_`\[\]]", "", block.replace("\n", " "))
                  return text[:200]
              return ""

          posts = []
          for root, _dirs, files in os.walk(SRC):
              for fname in sorted(files):
                  if not fname.endswith(".md") or fname.startswith("_index"):
                      continue
                  path = os.path.join(root, fname)
                  fm, body = parse(path)
                  rel = os.path.relpath(path, "techblogs").replace(os.sep, "/")

                  lang = "zh" if fname.endswith(".zh.md") else "en"
                  stem = fname[:-6] if lang == "zh" else fname[:-3]
                  slug = fm.get("slug") or stem

                  date = str(fm.get("date", ""))
                  dm = re.match(r"(\d{4}-\d{2}-\d{2})", date)
                  date = dm.group(1) if dm else datetime.now(timezone.utc).strftime("%Y-%m-%d")

                  post = {
                      "title": fm.get("title") or stem,
                      "date": date,
                      "summary": fm.get("description") or first_paragraph(body),
                      "slug": slug,
                      "lang": lang,
                      "author": fm.get("author") or "SeaGaruda",
                      "categories": fm.get("categories") or [],
                      "tags": fm.get("tags") or [],
                      "url": f"{SITE}/blog/post/{slug}/" if lang == "en"
                             else f"{SITE}/zh/blog/post/{slug}/",
                      "raw_url": f"https://raw.githubusercontent.com/{REPO}/{BRANCH}/{rel}",
                      "github_url": f"https://github.com/{REPO}/blob/{BRANCH}/{rel}",
                      "filename": rel,
                  }
                  posts.append(post)

          posts.sort(key=lambda p: (p["date"], p["slug"]), reverse=True)

          output = {
              "generated_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "posts": posts,
          }
          with open("posts.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print(f"Generated posts.json with {len(posts)} posts")
          for p in posts:
              print(f"  - [{p['date']}][{p['lang']}] {p['title']}")
          PYEOF

      - name: Checkout blog-index
        uses: actions/checkout@v4
        with:
          repository: seagaruda/blog-index
          ref: herbert
          token: ${{ secrets.BLOG_INDEX_TOKEN }}
          path: blog-index

      - name: Copy posts.json to blog-index
        run: |
          cp posts.json blog-index/public/posts.json
          head -30 posts.json

      - name: Commit and push to blog-index
        run: |
          cd blog-index
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/posts.json
          if git diff --staged --quiet; then
            echo "No changes to posts.json, skipping commit"
          else
            git commit -m "chore: sync posts.json from TechBlogs"
            git push origin herbert
            echo "Pushed posts.json to blog-index/herbert"
          fi
